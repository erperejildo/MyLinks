<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>My Links</h1>
            <div class="header-actions">
                <button id="add-btn" class="btn btn-add">Add</button>
                <button id="header-cancel-btn" class="btn btn-cancel hidden">Cancel</button>
            </div>
        </header>

        <div id="add-form" class="form-section hidden">
            <input type="hidden" id="edit-id" value="">
            <div class="form-group">
                <label for="link-title">Title</label>
                <input type="text" id="link-title" placeholder="e.g. Google Careers">
            </div>
            <div class="form-group">
                <label for="link-url">URL</label>
                <input type="url" id="link-url" placeholder="https://...">
            </div>
            <div class="form-actions">
                <button id="save-btn" class="btn btn-primary">Save</button>
                <button id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
            </div>
        </div>

        <div id="links-section">
            <div class="section-header">
                <h2>Saved Links</h2>
                <button id="reorder-btn" class="btn btn-reorder hidden">Reorder</button>
            </div>
            <ul id="links-list"></ul>
            <p id="empty-state" class="empty-state">No links saved yet. Click Add!</p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
