<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>My Links</h1>
            <div class="header-actions">
                <button id="add-btn" class="btn btn-add">Add</button>
                <button id="header-cancel-btn" class="btn btn-cancel hidden">Cancel</button>
            </div>
        </header>

        <div id="add-form" class="form-section hidden">
            <input type="hidden" id="edit-id" value="">
            <div class="form-group">
                <label for="link-title">Title</label>
                <input type="text" id="link-title" placeholder="e.g. Google Careers">
            </div>
            <div class="form-group">
                <label for="link-url">URL</label>
                <input type="url" id="link-url" placeholder="https://...">
            </div>
            <div class="form-actions">
                <button id="save-btn" class="btn btn-primary">Save</button>
            </div>
        </div>

        <div id="links-section">
            <div class="section-header">
                <button id="reorder-btn" class="btn btn-reorder hidden">Reorder</button>
            </div>
            <ul id="links-list"></ul>
            <p id="empty-state" class="empty-state">No links saved yet. Click Add!</p>
            <button id="copy-all-btn" class="btn btn-copy-all hidden">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
                Copy All
            </button>
        </div>
    </div>

    <script src="src/utils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
